# kind-cluster.yaml - three-node cluster used for Helm and Kustomize labs.
# Host port 30080 -> Helm dev release (NodePort), 30081 -> Kustomize dev overlay.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dso202
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30081
        hostPort: 30081
        protocol: TCP
  - role: worker
  - role: worker
